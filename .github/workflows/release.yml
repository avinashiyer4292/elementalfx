name: Release

# On every push to main, Changesets either opens a "Version Packages" pull
# request (when changesets are pending) or publishes versions that aren't on
# npm yet. Publishing uses npm trusted publishing (OIDC): no npm token is
# stored in the repo. Publishing stays off until the repository variable
# NPM_PUBLISH is set to "true" (see the README's Releasing section).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: pnpm install --no-frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: ${{ vars.NPM_PUBLISH == 'true' && 'pnpm release' || '' }}
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
